name: hang-debug
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/hang-debug.yml", "tools/ci/**"]
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev gfortran binutils build-essential gdb
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope || true
          cat /proc/sys/kernel/perf_event_paranoid; nproc
      - run: make lib nodemon calibrate examples examples/topdown_validate MPIRUN_FLAGS=--oversubscribe NRANKS=2
      - name: repeat run-topdown-validate, dump stacks on a hang
        run: |
          hangs=0
          for i in $(seq 1 40); do
            tools/ci/hang_watch.sh 90 make -s run-topdown-validate MPIRUN_FLAGS=--oversubscribe > out.txt 2>&1
            rc=$?
            if [ $rc = 124 ]; then hangs=$((hangs+1)); echo "##### iteration $i hung"; cat out.txt; fi
          done
          echo "hangs: $hangs / 40"
          [ $hangs = 0 ]
